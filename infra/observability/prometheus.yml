global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "enrollmenthub-fastapi"
    static_configs:
      - targets: ["localhost:8000"]
    metrics_path: "/metrics"

  - job_name: "enrollmenthub-dotnet"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: "/metrics"

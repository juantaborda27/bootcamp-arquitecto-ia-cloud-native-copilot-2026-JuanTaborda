trigger:
  branches:
    include:
      - main
      - develop
      - Diego-Tique

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: BuildAndTest
    displayName: 'Build and Test Stage'
    jobs:
      - job: DotNet_API
        displayName: 'Build & Test .NET API'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '9.x'
          - script: |
              dotnet restore templates/dotnet10-api/src/Api.csproj
              dotnet build templates/dotnet10-api/src/Api.csproj --configuration Release
              dotnet test templates/dotnet10-api/tests/Api.Tests.csproj --no-build --verbosity normal
            displayName: 'Restore, Build and Test .NET'

      - job: FastAPI
        displayName: 'Build & Test FastAPI'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.13'
          - script: |
              cd templates/fastapi
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python -m pytest tests/ -v
            displayName: 'Install Dependencies & Run Pytest'

      - job: NextJS_Frontend
        displayName: 'Build Next.js Frontend'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
          - script: |
              cd templates/next16-app
              npm ci
              npm run build
            displayName: 'Install Dependencies & Build Next.js'

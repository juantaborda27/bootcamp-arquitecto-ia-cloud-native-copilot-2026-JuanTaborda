name: deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: SHA inmutable publicado por el workflow CI
        required: true
        type: string

jobs:
  helm-deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - uses: azure/use-kubelogin@v1
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZ_RG }}
          cluster-name: ${{ secrets.AZ_AKS }}
          admin: false
      - name: Helm upgrade (dev)
        run: |
          helm upgrade --install enrollmenthub infra/helm/app -n app --create-namespace --set backend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-backend:${{ inputs.image_tag }} --set frontend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-frontend:${{ inputs.image_tag }}

  helm-deploy-stage:
    runs-on: ubuntu-latest
    needs: [ helm-deploy-dev ]
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - uses: azure/use-kubelogin@v1
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZ_RG }}
          cluster-name: ${{ secrets.AZ_AKS }}
          admin: false
      - name: Helm upgrade (stage)
        run: |
          helm upgrade --install enrollmenthub infra/helm/app -n app --create-namespace --set backend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-backend:${{ inputs.image_tag }} --set frontend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-frontend:${{ inputs.image_tag }}

  helm-deploy-prod:
    runs-on: ubuntu-latest
    needs: [ helm-deploy-stage ]
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { creds: ${{ secrets.AZURE_CREDENTIALS }} }
      - uses: azure/use-kubelogin@v1
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZ_RG }}
          cluster-name: ${{ secrets.AZ_AKS }}
          admin: false
      - name: Helm upgrade (prod)
        run: |
          helm upgrade --install enrollmenthub infra/helm/app -n app --create-namespace --set backend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-backend:${{ inputs.image_tag }} --set frontend.image=ghcr.io/${{ github.repository_owner }}/enrollmenthub-frontend:${{ inputs.image_tag }}
